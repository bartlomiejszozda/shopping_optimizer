services:
  app:
    build: .
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - ${HOST_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}:/app/host-ca.crt:ro
    environment:
      NODE_EXTRA_CA_CERTS: /app/host-ca.crt
    tmpfs:
      - /app/.vinext
    command: node scripts/start-container.mjs
volumes:
  node_modules:
